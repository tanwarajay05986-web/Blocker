name: Build Blocker APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK 36 install karo
        run: |
          yes | sdkmanager --install "platforms;android-36" "build-tools;36.0.0" || true

      - name: Gradle 8.13 install karo
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.13-bin.zip
          unzip -q gradle-8.13-bin.zip

      - name: APK build karo
        run: gradle-8.13/bin/gradle assembleDebug --no-daemon

      - name: APK upload karo
        uses: actions/upload-artifact@v4
        with:
          name: Blocker-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          
