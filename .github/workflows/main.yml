name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.13

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Build debug APK
        run: gradle assembleDebug --console=plain 2>&1 | tee build.log

      - name: Show errors
        if: failure()
        run: |
          echo "===== ERRORS ====="
          grep -E "^e: |error:|AAPT|Unresolved|Redeclaration" build.log | head -40 || true
          echo "===== WHAT WENT WRONG ====="
          grep -A8 "What went wrong" build.log || true

      - uses: actions/upload-artifact@v4
        with:
          name: Blocker-APK
          path: app/build/outputs/apk/debug/app-debug.apk
