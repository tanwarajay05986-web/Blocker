name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.13

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Build debug APK
        shell: bash
        run: |
          set +e
          gradle assembleDebug --console=plain > build.log 2>&1
          code=$?
          tail -n 60 build.log
          if [ $code -ne 0 ]; then
            {
              echo "## Build errors"
              echo '```'
              grep -E "^e: |error:|Unresolved reference|Redeclaration" build.log | head -30
              grep -A12 "What went wrong" build.log | head -30
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            grep -E "^e: " build.log | head -10 | while IFS= read -r line; do echo "::error::${line}"; done
          fi
          exit $code

      - uses: actions/upload-artifact@v4
        with:
          name: Blocker-APK
          path: app/build/outputs/apk/debug/app-debug.apk
